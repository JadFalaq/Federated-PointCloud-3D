seed: 42

paths:
  metadata_csv: data/processed/subset_metadata.csv
  pointcloud_root: data/raw/pointclouds
  processed_root: data/processed
  split_root: data/splits/subset_cpu
  output_root: outputs/subset_cpu

experiment:
  name: feastnet_subset_cpu
  task: classification
  num_classes: 50

model:
  architecture: feastnet
  in_channels: 6
  hidden_channels: [32, 64, 128]
  heads: [2, 2, 4]
  k: 12
  dropout: 0.25
  use_rgb: true

training:
  epochs: 8
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  device: cpu
  early_stopping_patience: 4

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

sampling:
  num_points: 384
  normalize: true
  augment_train: true

federated:
  rounds: 5
  local_epochs: 1
  clients: 4
  iid_fraction: 1.0
  scenario: non_iid

knowledge_distillation:
  alpha: 0.6
  temperature: 3.5
  student_hidden_channels: [16, 32, 64]
  student_heads: [2, 2, 2]
